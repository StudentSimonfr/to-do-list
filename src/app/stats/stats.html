<section>
  <h2>Statistiques</h2>
  <dl class="stats">
    <div><dt>Total</dt><dd>{{ service.total() }}</dd></div>
    <div><dt>Faites</dt><dd>{{ service.done() }}</dd></div>
    <div><dt>À faire</dt><dd>{{ service.remaining() }}</dd></div>
    <div><dt>Terminées</dt><dd>{{ service.percent() }} %</dd></div>
  </dl>
  <progress max="100" [value]="service.percent()"
    aria-label="Pourcentage de tâches terminées"></progress>
</section>

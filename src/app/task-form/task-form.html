<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label>
    Titre
    <input type="text" formControlName="title"
      [attr.aria-describedby]="uid + '-title-error'"
      [attr.aria-invalid]="form.controls.title.invalid && form.controls.title.touched">
  </label>
  <p class="error" [id]="uid + '-title-error'" aria-live="polite">
    @if (form.controls.title.touched && form.controls.title.invalid) {
      Le titre doit contenir au moins 3 caractères (hors espaces).
    }
  </p>

  <label>
    Description (facultative)
    <textarea formControlName="description" rows="2"></textarea>
  </label>

  <label>
    Échéance (facultative)
    <input type="date" formControlName="dueDate" [min]="today"
      [attr.aria-describedby]="uid + '-due-error'"
      [attr.aria-invalid]="form.controls.dueDate.invalid && form.controls.dueDate.touched">
  </label>
  <p class="error" [id]="uid + '-due-error'" aria-live="polite">
    @if (form.controls.dueDate.touched && form.controls.dueDate.invalid) {
      Choisissez une date valide, aujourd'hui ou plus tard.
    }
  </p>

  <div class="actions">
    <button type="submit" [disabled]="form.invalid">
      {{ task() ? 'Enregistrer' : 'Ajouter' }}
    </button>
    @if (task()) {
      <button type="button" (click)="cancelled.emit()">Annuler</button>
    }
  </div>
</form>
